# Builds a signed release AAB. Does not upload to Google Play.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the upload keystore; alias inside the store must be "upload"
#   STORE_PASSWORD           keystore password
#   KEY_PASSWORD             key password for alias "upload"
#   GOOGLE_SERVICES_JSON     raw app/google-services.json for package sa.sbtech.todo
#
# versionCode is this workflow's GITHUB_RUN_NUMBER (failed runs consume a number too).
# versionName is the tag without a leading "v", or 1.0.<run number> for a manual run.

name: Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundleRelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Require release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 GOOGLE_SERVICES_JSON STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode keystore and google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json, pathlib, sys
          keystore = pathlib.Path("${{ runner.temp }}/upload.jks").read_bytes()
          if len(keystore) < 4 or not (keystore[:4] == b"\xfe\xed\xfe\xed" or keystore[:1] == b"\x30"):
              print("::error::ANDROID_KEYSTORE_BASE64 did not decode to a JKS or PKCS12 keystore", file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("app/google-services.json")
          try:
              data = json.loads(path.read_text())
          except json.JSONDecodeError:
              print("::error::GOOGLE_SERVICES_JSON is not valid JSON", file=sys.stderr)
              sys.exit(1)
          packages = []
          for client in data.get("client") or []:
              info = (client.get("client_info") or {}).get("android_client_info") or {}
              package = info.get("package_name")
              if package:
                  packages.append(package)
          expected = "sa.sbtech.todo"
          if expected not in packages:
              print(f"::error::google-services.json packages {packages} do not include {expected}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Set version name
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Bundle signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: 2do-release-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
